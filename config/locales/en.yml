  text_csat_deliver_async_info: Only enable this if Redmine has a reliable Active Job queue backend.
  text_csat_auto_submit_info: "Records the rating as soon as the page opens, without the customer pressing Submit. Some email security scanners run JavaScript, so this can record ratings the customer never gave."
  text_csat_zero_means_never: 0 means never.
  text_csat_assignee_info: Only users with an assignable role in some project are listed. The follow-up is left unassigned if this user cannot be assigned in the follow-up project.
  text_csat_retention_info: "0 keeps survey data forever. Applied by rake redmine_csat:purge."

