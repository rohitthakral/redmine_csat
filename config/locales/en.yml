  text_csat_survey_closed: This survey is no longer available.
  text_csat_score_definition: "CSAT score is the percentage of responses rated Great. Response rate is responses divided by surveys delivered."
  text_csat_period_filter: The dates filter on when the survey was sent.
  text_csat_follow_up_errors:
    one: "1 follow-up issue could not be created. Hover over \"Failed\" for the reason."
