  button_csat_insert_default: Insert the built-in template
  button_csat_preview_email: Preview email
  button_csat_send_test: "Send a test email to %{email}"
  text_csat_subject_info: "Placeholders such as {{issue_id}}, {{issue_subject}} and {{project}} can be used. See the list under Custom templates."
  text_csat_logo_info: "Optional. A public https:// image, shown 40px high. Without a logo, the company name is shown."
  text_csat_brand_color_info: Used for the top border and the company name. The rating buttons keep their own colours so they stay readable.
  text_csat_intro_info: Plain text; HTML tags are shown as typed (use a custom template for HTML). Leave empty to use the default text shown. Placeholders can be used, and a blank line starts a new paragraph.
  text_csat_custom_templates_info: "Replace the whole email with your own HTML and/or plain-text template. Leave a field empty to use the built-in design. Values are inserted with {{placeholder}} tags and are HTML-escaped automatically. A template must contain {{rating_buttons}} or the {{great_url}}, {{okay_url}} and {{poor_url}} links, otherwise the built-in template is used."
  text_csat_preview_buttons_info: Uses the values in this form, including changes you have not saved yet. Opens in a new tab.
  text_csat_replace_template_confirm: Replace the current template with the built-in one?
  text_csat_preview_info: This preview uses example data and the values from the settings form. The rating buttons are disabled here.
  text_csat_template_missing_links: "%{template} has no rating links ({{rating_buttons}}, {{great_url}}, {{okay_url}} or {{poor_url}}), so the built-in template is used instead."
  text_csat_template_unknown_placeholders: "%{template} uses unknown placeholders, which will appear as typed: %{names}"
  text_csat_test_sent: "A test email has been sent to %{email}."
  text_csat_test_links_inactive: The rating buttons in a test email do not belong to a real survey and lead to a "not found" page.
  text_csat_test_no_email: Your account has no email address.
  text_csat_test_failed: "The test email could not be sent: %{message}"
  text_csat_close_tab: You can close this tab and return to the settings page.
  text_csat_greeting: Hello,
  text_csat_greeting_named: "Hi %{name},"
  text_csat_email_intro_default: "{{greeting}}\n\nThank you for contacting {{company_name}}. We recently resolved your request #{{issue_id}}, \"{{issue_subject}}\".\n\nWe'd love to know how we did. It only takes one click."
  text_csat_email_footer_default: "This is a one-time survey about request #{{issue_id}}. {{expiry_notice}}\n{{company_name}}"
  text_csat_email_hint: Choose the answer that best describes your experience.
  text_csat_email_hint_comment: Choose an answer. You can add a comment on the next page if you like.
  text_csat_email_preheader: "Tell us how we did with request #%{issue_id}. It takes one click."
  text_csat_expiry_notice: "The survey link expires on %{date}."
  text_csat_handled_by: "Handled by %{name}"
  text_csat_sample_issue_subject: Unable to export the monthly report
  text_csat_sample_project: Example project
  text_csat_sample_agent: Alex from Support

